
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TM1 - Kartu Profil Utility Style</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-8 font-sans text-slate-800">

    <main class="mx-auto w-full max-w-3xl">
        <h1 class="mb-6 text-center text-3xl font-bold">
            Kartu Profil Mahasiswa
        </h1>

        <article
            id="profil"
            class="flex items-start gap-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-md sm:items-center sm:gap-5 sm:p-6"
        >
            <img
                src="https://i.pravatar.cc/160?img=12"
                alt="Foto profil Rayyan Ahmad"
                class="h-14 w-14 shrink-0 rounded-full object-cover sm:h-[88px] sm:w-[88px]"
            >

            <div class="min-w-0">
                <h2 class="mb-1 text-xl font-bold sm:text-2xl">
                    Rayyan
                </h2>

                <p class="mb-2 text-slate-500">
                    Mahasiswa Informatika
                </p>

                <p class="mb-3 text-sm text-slate-600">
                    NIM: 2024520047
                </p>

                <p class="mb-4 leading-relaxed">
                    Tertarik pada pengembangan web, data, dan teknologi.
                    Sedang mempelajari pengembangan aplikasi modern.
                </p>

                <a
                    href="#profil"
                    class="inline-block rounded-lg bg-blue-600 px-4 py-2.5 text-white transition hover:bg-blue-700"
                >
                    Lihat Profil
                </a>
            </div>
        </article>
    </main>

</body>
</html>
